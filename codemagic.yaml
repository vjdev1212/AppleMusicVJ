workflows:
  strmify-ios-build:
    name: MyApp iOS Build
    environment:
      node: latest
      xcode: latest
      groups:
        - EXPO
      vars:
        RCT_NEW_ARCH_ENABLED: 1
    scripts:
      - name: Install dependencies
        script: npm install --force

      - name: Install Expo CLI
        script: npm install -g @expo/cli@latest --force

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV
          echo "📱 Building: $APP_NAME v$APP_VERSION"

      - name: Prebuild iOS project with New Architecture
        script: |
          rm -rf ios android
          
          # ✅ CRITICAL: Export the flag BEFORE prebuild
          export RCT_NEW_ARCH_ENABLED=1
          
          npx expo prebuild --clean --platform ios
          
          # Verify it was set correctly
          echo "🔍 Checking if New Architecture is enabled..."
          grep -r "RCT_NEW_ARCH_ENABLED" ios/*.xcodeproj/project.pbxproj || echo "⚠️ Not found in project"
          
          # Fix deployment target
          sed -i '' 's/platform :ios, .*/platform :ios, "15.0"/' ios/Podfile
          echo "✅ Deployment target set to 15.0"

      - name: Patch Podfile for New Architecture
        script: |
          cd ios
          
          # ✅ Add explicit New Architecture flag to Podfile
          cat >> Podfile << 'EOF'

          # Force New Architecture
          ENV['RCT_NEW_ARCH_ENABLED'] = '1'
          EOF
          
          echo "📝 Podfile contents:"
          cat Podfile

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          
          # ✅ Set the flag during pod install too
          export RCT_NEW_ARCH_ENABLED=1
          
          echo "📦 Installing CocoaPods..."
          pod install --repo-update
          
          echo "✅ CocoaPods installed successfully"

      - name: Archive with Xcode
        script: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found"
            exit 1
          fi
          
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "🏗️ Building scheme: $SCHEME_NAME"
          
          mkdir -p build
          
          # ✅ Set the flag during build
          export RCT_NEW_ARCH_ENABLED=1
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/$SCHEME_NAME.xcarchive" \
            archive \
            RCT_NEW_ARCH_ENABLED=1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "✅ Archive created successfully"

      - name: Export IPA
        script: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_NAME="${APP_NAME}_v${APP_VERSION}"
          
          cat > build/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath "build/$SCHEME_NAME.xcarchive" \
            -exportPath "build/export" \
            -exportOptionsPlist build/ExportOptions.plist
          
          EXPORTED_IPA=$(find build/export -name "*.ipa" | head -1)
          
          if [ -z "$EXPORTED_IPA" ]; then
            echo "❌ No IPA found in export directory"
            ls -la build/export/ || true
            exit 1
          fi
          
          cp "$EXPORTED_IPA" "build/${IPA_NAME}.ipa"
          IPA_SIZE=$(ls -lh "build/${IPA_NAME}.ipa" | awk '{print $5}')
          
          echo "✅ IPA created: ${IPA_NAME}.ipa (${IPA_SIZE})"

    artifacts:
      - ios/build/*.ipa
      - ios/build/**/*.xcarchive

  # Android workflows remain unchanged
  strmify-android-build:
    name: Strmify Android Build
    environment:
      node: latest
      java: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: npm install --force

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV

      - name: Clean and generate Android project
        script: |
          rm -rf ios android
          npm install -g @expo/cli@latest --force
          npx expo prebuild --platform android

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease -x configureCMakeRelease -Pandroid.overridePathCheck=true
          
          APK_NAME="${APP_NAME}_v${APP_VERSION}_release.apk"
          cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          echo "✅ APK created: $APK_NAME"

    artifacts:
      - "*.apk"