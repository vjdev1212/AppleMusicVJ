workflows:
  ios-build:
    name: AppleMusic iOS Build

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      vars:
        RCT_NEW_ARCH_ENABLED: 0

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Install dependencies
        script: npm install --force

      - name: Install Expo CLI
        script: npm install -g @expo/cli@latest --force

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV
          echo "📱 Building: $APP_NAME v$APP_VERSION"

      - name: Prebuild iOS project
        script: |
          rm -rf ios android
          export RCT_NEW_ARCH_ENABLED=0
          npx expo prebuild --clean --platform ios
          echo "✅ Prebuild complete"

      - name: Patch Podfile for Architecture
        script: |
          cd ios
          # Fix deployment target
          sed -i '' 's/platform :ios, .*/platform :ios, "15.0"/' Podfile || true
          
          # Force Architecture in Podfile
          cat >> Podfile << 'EOF'
          
          # Force Old Architecture
          ENV['RCT_NEW_ARCH_ENABLED'] = '0'
          EOF
          
          echo "📝 Podfile patched:"
          cat Podfile

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          export RCT_NEW_ARCH_ENABLED=0
          
          echo "📦 Installing CocoaPods..."
          pod install --repo-update
          
          echo "✅ CocoaPods installed successfully"

      - name: Build and create IPA
        script: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found"
            exit 1
          fi
          
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_NAME="${APP_NAME}_v${APP_VERSION}"
          
          echo "🏗️ Building scheme: $SCHEME_NAME"
          mkdir -p build
          
          export RCT_NEW_ARCH_ENABLED=0
          
          # Build without code signing
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            RCT_NEW_ARCH_ENABLED=0 | tee xcodebuild.log
          
          # Find the .app
          APP_PATH=$(find build/DerivedData -name "${SCHEME_NAME}.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          
          # Package .app into .ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/${SCHEME_NAME}.app"
          cd build
          zip -r "${IPA_NAME}.ipa" Payload
          rm -rf Payload
          
          IPA_SIZE=$(ls -lh "${IPA_NAME}.ipa" | awk '{print $5}')
          echo "✅ IPA created: ${IPA_NAME}.ipa (${IPA_SIZE})"

    artifacts:
      - ios/build/*.ipa
      - ios/xcodebuild.log

  android-build:
    name: AppleMusic Android Build
    environment:
      node: "20"
      java: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Install dependencies
        script: npm install --force

      - name: Extract app version from app.json
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV

      - name: Clean and generate Android project
        script: |
          rm -rf ios android
          npm install -g @expo/cli@latest --force
          npx expo prebuild --platform android

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease -x configureCMakeRelease -Pandroid.overridePathCheck=true --stacktrace

          APK_NAME="${APP_NAME}_v${APP_VERSION}_release.apk"
          cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          echo "✅ APK created: $APK_NAME"

    artifacts:
      - "*.apk"
