workflows:
  ios-build:
    name: AppleMusic iOS Build
    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      vars:
        RCT_NEW_ARCH_ENABLED: 0

    scripts:
      # 1. Install dependencies
      - name: Install dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install

      # 2. Install Expo CLI
      - name: Install Expo CLI
        script: |
          npm install -g @expo/cli@latest --force

      # 3. Validate Expo setup
      - name: Validate Expo setup
        script: |
          npx expo doctor || true

      # 4. Extract app info
      - name: Extract app info
        script: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")

          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV

          echo "📱 Building: $APP_NAME v$APP_VERSION"

      # 5. Prebuild iOS project
      - name: Prebuild iOS project
        script: |
          rm -rf ios android
          export RCT_NEW_ARCH_ENABLED=0
          npx expo prebuild --clean --platform ios --no-install
          npx expo install

      # 6. Patch Podfile
      - name: Patch Podfile
        script: |
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "15.0"/' Podfile || true

      # 7. Install CocoaPods
      - name: Install CocoaPods
        script: |
          cd ios

          rm -rf Pods Podfile.lock

          pod deintegrate

          export RCT_NEW_ARCH_ENABLED=0

          npx pod-install
          pod install --repo-update --verbose

          echo "📦 Checking Expo scripts..."
          find Pods -name "expo-configure-project.sh" || true

          if [ ! -f "Pods/Target Support Files/Pods-AppleMusicPlayer/expo-configure-project.sh" ]; then
            echo "⚠️ Missing expo-configure-project.sh, creating dummy file"
            mkdir -p "Pods/Target Support Files/Pods-AppleMusicPlayer"

            cat << 'EOF' > "Pods/Target Support Files/Pods-AppleMusicPlayer/expo-configure-project.sh"
            #!/bin/sh
            exit 0
            EOF

            chmod +x "Pods/Target Support Files/Pods-AppleMusicPlayer/expo-configure-project.sh"
          fi

      # 8. Build and create IPA
      - name: Build and create IPA
        script: |
          set -e
          cd ios

          echo "📂 Debug workspace:"
          ls -la
          ls -la *.xcworkspace || true

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "❌ No workspace found"
            exit 1
          fi

          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_NAME="${APP_NAME}_v${APP_VERSION}"

          echo "🏗️ Building scheme: $SCHEME_NAME"

          mkdir -p build

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -UseModernBuildSystem=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"
            exit 1
          fi

          echo "✅ Found app: $APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qr "${IPA_NAME}.ipa" Payload

          echo "✅ IPA created: ${IPA_NAME}.ipa"

    artifacts:
      - ios/build/*.ipa
