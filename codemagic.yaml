workflows:
  strmify-ios-build:
    name: AppleMusic iOS Build
    environment:
      node: "20"
      xcode: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Extract app version from app.json
        script: |
          set -e
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV
          echo "Building: $APP_NAME v$APP_VERSION"

      - name: Prebuild iOS project
        script: |
          set -e
          rm -rf ios android
          npx expo prebuild --clean --platform ios
          echo "Prebuild complete"

      - name: Patch Podfile for deployment target
        script: |
          set -e
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "15.1"/' Podfile

          cat > /tmp/patch.js << 'PATCHSCRIPT'
          const fs = require('fs');
          let podfile = fs.readFileSync('Podfile', 'utf8');
          const injection = [
            '    installer.pods_project.targets.each do |target|',
            '      target.build_configurations.each do |config|',
            '        config.build_settings[\'IPHONEOS_DEPLOYMENT_TARGET\'] = \'15.1\'',
            '      end',
            '    end',
            ''
          ].join('\n');
          podfile = podfile.replace(
            'post_install do |installer|',
            'post_install do |installer|\n' + injection
          );
          fs.writeFileSync('Podfile', podfile);
          PATCHSCRIPT
          node /tmp/patch.js

          echo "Podfile patched:"
          cat Podfile

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock
          echo "Installing CocoaPods..."
          pod install --repo-update
          echo "CocoaPods installed successfully"

      - name: Build and create IPA
        script: |
          set -e
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found"
            ls -la
            exit 1
          fi

          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_NAME="${APP_NAME}_v${APP_VERSION}"

          echo "Building scheme: $SCHEME_NAME"
          mkdir -p build

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-"

          APP_PATH=$(find build/DerivedData -name "${SCHEME_NAME}.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found after build"
            find build/DerivedData -name "*.app" -type d || true
            exit 1
          fi

          echo "Found .app at: $APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/${SCHEME_NAME}.app"
          cd build
          zip -r "${IPA_NAME}.ipa" Payload
          rm -rf Payload

          IPA_SIZE=$(ls -lh "${IPA_NAME}.ipa" | awk '{print $5}')
          echo "IPA created: ${IPA_NAME}.ipa (${IPA_SIZE})"

    artifacts:
      - ios/build/*.ipa

  strmify-android-build:
    name: AppleMusic Android Build
    environment:
      node: "20"
      java: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Extract app version from app.json
        script: |
          set -e
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name.replace(/[^a-zA-Z0-9]/g, '')")
          echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
          echo "APP_NAME=$APP_NAME" >> $CM_ENV

      - name: Clean and generate Android project
        script: |
          set -e
          rm -rf ios android
          npx expo prebuild --platform android

      - name: Build Android APK
        script: |
          set -e
          cd android
          ./gradlew assembleRelease -x configureCMakeRelease -Pandroid.overridePathCheck=true

          APK_NAME="${APP_NAME}_v${APP_VERSION}_release.apk"
          cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          echo "APK created: $APK_NAME"

    artifacts:
      - "*.apk"
