workflows:
  strmify-ios-build:
    name: AppleMusic iOS Build
    environment:
      node: latest
      xcode: latest
      groups:
        - EXPO
    scripts:
      - name: Install dependencies
        script: npm install --force

      - name: Install Expo CLI
        script: npm install -g @expo/cli@latest --force

      - name: Check Expo CLI version
        script: npx expo --version

      - name: Extract app version from app.json
        script: |
          if [ -f "app.json" ]; then
            APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.version")
            APP_NAME=$(node -p "JSON.parse(require('fs').readFileSync('app.json', 'utf8')).expo.name.replace(/[^a-zA-Z0-9]/g, '')")
            echo "App Name: $APP_NAME"
            echo "Version: $APP_VERSION"
            echo "APP_VERSION=$APP_VERSION" >> $CM_ENV
            echo "APP_NAME=$APP_NAME" >> $CM_ENV
          else
            echo "app.json not found, using default values"
            echo "APP_VERSION=1.0.0" >> $CM_ENV
            echo "APP_NAME=AppleMusicPlayer" >> $CM_ENV
          fi

      - name: Fix expo-updates build script
        script: |
          mkdir -p node_modules/expo-updates/scripts
          cat > node_modules/expo-updates/scripts/create-manifest-ios.sh << 'SCRIPTEOF'
          #!/bin/bash
          mkdir -p "${DERIVED_FILE_DIR}" 2>/dev/null || true
          touch "${DERIVED_FILE_DIR}/EXUpdates.generated.m" 2>/dev/null || true
          exit 0
          SCRIPTEOF
          chmod +x node_modules/expo-updates/scripts/create-manifest-ios.sh

      - name: Prebuild iOS project
        script: |
          rm -rf ios android
          npx expo prebuild --clean --platform ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Archive with Xcode
        script: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found"
            exit 1
          fi
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME_NAME"

          mkdir -p build

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/$SCHEME_NAME.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID:-}" \
            SWIFT_VERSION=5.0

      - name: Export IPA
        script: |
          cd ios
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          ARCHIVE_PATH="build/$SCHEME_NAME.xcarchive"
          IPA_NAME="${APP_NAME}_v${APP_VERSION}"

          cat > build/ExportOptions.plist << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string><none></string>
          </dict>
          </plist>
          PLISTEOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "build/export" \
            -exportOptionsPlist build/ExportOptions.plist

          EXPORTED_IPA=$(find build/export -name "*.ipa" | head -1)
          if [ -z "$EXPORTED_IPA" ]; then
            echo "No IPA found in export directory"
            ls -la build/export/ || true
            exit 1
          fi

          cp "$EXPORTED_IPA" "build/${IPA_NAME}.ipa"
          IPA_SIZE=$(ls -lh "build/${IPA_NAME}.ipa" | awk '{print $5}')
          echo "IPA created: build/${IPA_NAME}.ipa (${IPA_SIZE})"

    artifacts:
      - ios/build/*.ipa
      - ios/build/**/*.xcarchive

